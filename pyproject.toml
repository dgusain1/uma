[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uma"
version = "2.0.0"
description = "Collect Pyomo results as pandas DataFrames for easier access."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Digvijay Gusain", email = "digvijay.gusain29@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.5", "pyomo>=6.4"]
keywords = ["pyomo", "pandas", "optimization", "modeling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/dgusain1/uma"
Issues = "https://github.com/dgusain1/uma/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uma = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
